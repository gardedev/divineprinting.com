<!DOCTYPE html>
<!--
  login.html — Divine Printing (Task 4.4)

  LEGACY NOTICE: The direct username/password login form that previously
  existed here has been REMOVED. The direct Cognito JS SDK (amazon-cognito-identity-js)
  password-based authentication is incompatible with the approved Cognito Hosted UI
  + PKCE architecture.

  This page now immediately redirects to the Cognito Hosted UI via
  cognito-auth.js (PKCE Authorization Code flow). It is retained as a URL
  entry point so that existing bookmarks/links to /account/login.html still work.

  Removed:
    - Direct AmazonCognitoIdentity.authenticateUser() call (password-based login)
    - Direct AmazonCognitoIdentity.signUp() call (password-based registration)
    - localStorage token storage (dp_id_token, dp_access_token, dp_refresh_token)
    - AWS SDK + amazon-cognito-identity-js library loading
    - All password form HTML and JavaScript
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sign In | Divine Printing</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #3d1a6e;
            --gold: #c9a227;
            --gold-pale: #f5efe0;
            --dark: #1a0d30;
            --gray: #6b5b7a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--purple) 0%, #5a2d8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .redirect-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            text-align: center;
        }

        .redirect-header {
            background: var(--gold-pale);
            padding: 40px 40px 30px;
        }

        .redirect-header img {
            height: 60px;
            margin-bottom: 20px;
        }

        .redirect-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--purple);
            margin-bottom: 8px;
        }

        .redirect-header p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        .redirect-body {
            padding: 40px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(61,26,110,0.15);
            border-top-color: var(--purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .redirect-body p {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--purple) 0%, #5a2d8a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.3s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--purple);
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-header">
            <a href="../index.html">
                <img src="../images/logo.png" alt="Divine Printing" onerror="this.style.display='none'">
            </a>
            <h1>Welcome Back</h1>
            <p>Redirecting you to sign in securely…</p>
        </div>

        <div class="redirect-body">
            <div class="spinner" id="spinner"></div>
            <p id="redirectMessage">Taking you to our secure sign-in page…</p>
            <button class="btn-primary" id="manualSignInBtn" style="display:none;">
                Sign In Now
            </button>
            <a href="../index.html" class="back-link">← Return to homepage</a>
        </div>
    </div>

    <!--
      cognito-auth.js provides the canonical Hosted UI + PKCE login() function.
      No password forms, no AWS SDK, no amazon-cognito-identity-js.
    -->
    <script src="../js/cognito-auth.js"></script>
    <script>
        /**
         * This page is a thin redirect shim.
         * It automatically triggers the Cognito Hosted UI login via PKCE.
         *
         * Removed: All direct Cognito JS SDK usage (authenticateUser, signUp, etc.)
         * Removed: All password form handling
         * Removed: All localStorage token storage
         */
        (function () {
            'use strict';

            // Show manual button after 3 seconds in case redirect is slow
            var manualBtn = document.getElementById('manualSignInBtn');
            var redirectMsg = document.getElementById('redirectMessage');
            var spinner = document.getElementById('spinner');

            var fallbackTimer = setTimeout(function () {
                if (manualBtn) manualBtn.style.display = 'inline-block';
                if (redirectMsg) redirectMsg.textContent = 'Click below to sign in securely.';
                if (spinner) spinner.style.display = 'none';
            }, 3000);

            if (manualBtn) {
                manualBtn.addEventListener('click', function () {
                    clearTimeout(fallbackTimer);
                    if (typeof login === 'function') {
                        login();
                    } else {
                        window.location.href = '../account/account.html';
                    }
                });
            }

            // Auto-redirect: check if already signed in, or trigger login
            document.addEventListener('DOMContentLoaded', function () {
                // If user is already authenticated, send them to the account page
                if (typeof getCurrentUser === 'function' && getCurrentUser()) {
                    clearTimeout(fallbackTimer);
                    window.location.href = '../account/account.html';
                    return;
                }

                // Trigger Cognito Hosted UI login (PKCE flow)
                if (typeof login === 'function') {
                    login().catch(function () {
                        // If login() rejects, show manual button
                        clearTimeout(fallbackTimer);
                        if (manualBtn) manualBtn.style.display = 'inline-block';
                        if (redirectMsg) redirectMsg.textContent = 'Click below to sign in securely.';
                        if (spinner) spinner.style.display = 'none';
                    });
                } else {
                    // cognito-auth.js not loaded — show fallback
                    clearTimeout(fallbackTimer);
                    if (manualBtn) manualBtn.style.display = 'inline-block';
                    if (redirectMsg) redirectMsg.textContent = 'Click below to sign in securely.';
                    if (spinner) spinner.style.display = 'none';
                }
            });
        })();
    </script>
</body>
</html>
