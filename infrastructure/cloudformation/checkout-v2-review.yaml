AWSTemplateFormatVersion: '2010-09-09'
Description: Review-only Task 6.3 dedicated authenticated Stripe Checkout runtime.

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  StripeSecretArn:
    Type: String
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_hs1jWXB87
  CognitoClientId:
    Type: String
    Default: pf2ioscnn7vf7c4if5mjemos

Resources:
  CheckoutRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: divine-printing-checkout-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DivinePrintingCheckoutRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CheckoutCartReadWrite
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-carts
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-cart-items
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-cart-items/index/ProductCartItemIndex
              - Sid: CheckoutOrderWrites
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-orders-v2
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-orders-v2/index/*
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-order-items-v2
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-order-items-v2/index/*
              - Sid: AuthoritativeProductReads
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query]
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-products
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-products/index/*
              - Sid: AuthoritativeCustomerReads
                Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-customers-v2
              - Sid: RuntimeLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: arn:aws:logs:us-east-1:911762440868:log-group:/aws/lambda/divine-printing-checkout:*
  CheckoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: divine-printing-checkout
      Runtime: nodejs22.x
      Handler: checkoutLambda.handler
      Role: !GetAtt CheckoutRuntimeRole.Arn
      Timeout: 20
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey }
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CARTS_TABLE: divine-printing-carts
          CART_ITEMS_TABLE: divine-printing-cart-items
          ORDERS_TABLE: divine-printing-orders-v2
          ORDER_ITEMS_TABLE: divine-printing-order-items-v2
          CHECKOUT_SUCCESS_URL: https://divineprinting.com/checkout/success.html
          CHECKOUT_CANCEL_URL: https://divineprinting.com/checkout/cancel.html
          STRIPE_TAX_ENABLED: 'false'
          STRIPE_SECRET_KEY: !Sub '{{resolve:secretsmanager:${StripeSecretArn}:SecretString:STRIPE_SECRET_KEY}}'
  CheckoutApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: divine-printing-checkout-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [https://divineprinting.com, https://www.divineprinting.com]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key, If-Match]
  CheckoutIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CheckoutApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CheckoutFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000
  CheckoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CheckoutApi
      RouteKey: POST /api/checkout/session
      Target: !Sub integrations/${CheckoutIntegration}
  CheckoutStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: { ApiId: !Ref CheckoutApi, StageName: '$default', AutoDeploy: true }
  CheckoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CheckoutFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CheckoutApi}/*/POST/api/checkout/session

Outputs:
  CheckoutApiEndpoint: { Value: !GetAtt CheckoutApi.ApiEndpoint }
