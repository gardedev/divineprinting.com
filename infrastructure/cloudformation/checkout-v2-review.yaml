AWSTemplateFormatVersion: '2010-09-09'
Description: DivinePrinting authenticated Stripe Checkout and signed webhook runtime.

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  StripeSecretArn:
    Type: String
  StripeWebhookSecretArn:
    Type: String
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_hs1jWXB87
  CognitoClientId:
    Type: String
    Default: pf2ioscnn7vf7c4if5mjemos

Resources:
  CheckoutRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: divine-printing-checkout-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DivinePrintingCheckoutRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CheckoutCartReadWrite
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-carts
              - Sid: CheckoutCartQueries
                Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-carts/index/CustomerActiveCartIndex
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-cart-items
              - Sid: CheckoutOrderWrites
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-orders-v2
              - Sid: CheckoutOrderSessionLookup
                Effect: Allow
                Action: dynamodb:Query
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-orders-v2/index/StripeCheckoutSessionIndex
              - Sid: StripeEventPersistence
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt StripeEventsTable.Arn
              - Sid: CheckoutOrderItemWrites
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-order-items-v2
              - Sid: CheckoutOrderItemReads
                Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-order-items-v2
              - Sid: AuthoritativeProductReads
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-products
              - Sid: AuthoritativeCustomerReads
                Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: arn:aws:dynamodb:us-east-1:911762440868:table/divine-printing-customers-v2
              - Sid: StripeTestSecretRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref StripeSecretArn
              - Sid: StripeWebhookSecretRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref StripeWebhookSecretArn
              - Sid: RuntimeLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: arn:aws:logs:us-east-1:911762440868:log-group:/aws/lambda/divine-printing-checkout:*
  CheckoutLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/divine-printing-checkout
      RetentionInDays: 30
  StripeEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: divine-printing-stripe-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stripeEventId
          AttributeType: S
      KeySchema:
        - AttributeName: stripeEventId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
  CheckoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: divine-printing-checkout
      Runtime: nodejs22.x
      Handler: checkoutLambda.handler
      Role: !GetAtt CheckoutRuntimeRole.Arn
      Timeout: 20
      MemorySize: 512
      Code: { S3Bucket: !Ref ArtifactBucket, S3Key: !Ref ArtifactKey }
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          CARTS_TABLE: divine-printing-carts
          CART_ITEMS_TABLE: divine-printing-cart-items
          ORDERS_TABLE: divine-printing-orders-v2
          ORDER_ITEMS_TABLE: divine-printing-order-items-v2
          CHECKOUT_SUCCESS_URL: https://divineprinting.com/checkout/success.html
          CHECKOUT_CANCEL_URL: https://divineprinting.com/checkout/cancel.html
          STRIPE_TAX_ENABLED: 'false'
          STRIPE_SECRET_ARN: !Ref StripeSecretArn
          STRIPE_WEBHOOK_SECRET_ARN: !Ref StripeWebhookSecretArn
          STRIPE_EVENTS_TABLE: !Ref StripeEventsTable
  CheckoutApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: divine-printing-checkout-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [https://divineprinting.com, https://www.divineprinting.com]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key, If-Match]
  CheckoutIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CheckoutApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CheckoutFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000
  CheckoutJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref CheckoutApi
      Name: divine-printing-checkout-cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref CognitoClientId]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
  CheckoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CheckoutApi
      RouteKey: POST /api/checkout/session
      AuthorizationType: JWT
      AuthorizerId: !Ref CheckoutJwtAuthorizer
      Target: !Sub integrations/${CheckoutIntegration}
  CheckoutWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CheckoutApi
      RouteKey: POST /api/checkout/webhook
      AuthorizationType: NONE
      Target: !Sub integrations/${CheckoutIntegration}
  CheckoutStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: { ApiId: !Ref CheckoutApi, StageName: '$default', AutoDeploy: true }
  CheckoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CheckoutFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CheckoutApi}/*/POST/api/checkout/session
  CheckoutWebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CheckoutFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CheckoutApi}/*/POST/api/checkout/webhook

Outputs:
  CheckoutApiEndpoint: { Value: !GetAtt CheckoutApi.ApiEndpoint }
